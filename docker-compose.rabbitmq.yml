# RabbitMQ con plugin de management (UI en http://localhost:15672 — guest/guest).
# Uso: docker compose -f docker-compose.rabbitmq.yml up -d

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
